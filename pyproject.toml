[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "white-box-state-transition-governance-reference-demo"
version = "0.2.2"
description = "Deterministic white-box reference demonstration for candidate-first state-transition governance"
requires-python = ">=3.9"

[project.scripts]
wbstg-demo = "wbstg.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
